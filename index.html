<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>عامل دليفري | طبرق</title>

    <meta name="description"
          content="عامل دليفري - منصة الخدمات والعمال في طبرق">

    <meta name="theme-color" content="#0b1f3a">

    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            min-height: 100vh;
            font-family: Tahoma, Arial, sans-serif;
            background:
                radial-gradient(circle at 50% 0%, rgba(218, 169, 53, 0.16), transparent 35%),
                linear-gradient(145deg, #071525, #0b1f3a 55%, #06111f);
            color: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 24px;
            overflow: hidden;
        }

        .page {
            width: 100%;
            max-width: 430px;
            text-align: center;
        }

        .card {
            position: relative;
            background: rgba(255, 255, 255, 0.07);
            border: 1px solid rgba(255, 255, 255, 0.12);
            border-radius: 30px;
            padding: 42px 28px 30px;
            backdrop-filter: blur(18px);
            -webkit-backdrop-filter: blur(18px);
            box-shadow:
                0 25px 70px rgba(0, 0, 0, 0.35),
                inset 0 1px 0 rgba(255,255,255,0.08);
        }

        .logo-box {
            width: 145px;
            height: 145px;
            margin: 0 auto 25px;
            border-radius: 34px;
            background: #ffffff;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 15px;
            box-shadow:
                0 15px 40px rgba(0, 0, 0, 0.28),
                0 0 0 6px rgba(218, 169, 53, 0.10);
        }

        .logo {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .location {
            display: inline-block;
            color: #d8b45a;
            font-size: 14px;
            font-weight: bold;
            letter-spacing: 0.5px;
            margin-bottom: 13px;
        }

        h1 {
            font-size: 31px;
            font-weight: 800;
            margin-bottom: 12px;
            letter-spacing: -0.5px;
        }

        .description {
            color: rgba(255,255,255,0.72);
            font-size: 16px;
            line-height: 1.9;
            margin-bottom: 30px;
        }

        .button {
            width: 100%;
            min-height: 58px;
            border: none;
            border-radius: 17px;
            background: linear-gradient(135deg, #d8ad45, #b88927);
            color: #071525;
            display: flex;
            align-items: center;
            justify-content: center;
            text-decoration: none;
            font-size: 18px;
            font-weight: 800;
            box-shadow: 0 12px 30px rgba(216, 173, 69, 0.25);
            transition: transform 0.2s ease,
                        box-shadow 0.2s ease;
        }

        .button:hover {
            transform: translateY(-2px);
            box-shadow: 0 16px 35px rgba(216, 173, 69, 0.35);
        }

        .button:active {
            transform: translateY(0);
        }

        .line {
            width: 55px;
            height: 3px;
            border-radius: 20px;
            background: #d8ad45;
            margin: 27px auto 20px;
        }

        .footer {
            color: rgba(255,255,255,0.45);
            font-size: 12px;
        }

        @media (max-width: 400px) {
            .card {
                padding: 34px 20px 25px;
            }

            .logo-box {
                width: 125px;
                height: 125px;
            }

            h1 {
                font-size: 27px;
            }
        }
    </style>
</head>

<body>

    <main class="page">

        <section class="card">

            <div class="logo-box">
                <img
                    src="logo.png"
                    alt="شعار عامل دليفري"
                    class="logo">
            </div>

            <div class="location">
                طبرق
            </div>

            <h1>عامل دليفري</h1>

            <p class="description">
                منصة تساعدك على الوصول إلى العمال والفنيين
                والخدمات بسهولة وسرعة.
            </p>

            <a
                href="https://working.gt.tc/"
                class="button"
                target="_blank"
                rel="noopener noreferrer">
                دخول المنصة
            </a>

            <div class="line"></div>

            <div class="footer">
                أقرب لك وأسرع في خدمتك
            </div>

        </section>

    </main>

</body>
</html>
