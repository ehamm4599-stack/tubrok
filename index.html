<!DOCTYPE html>
<html lang="ar" dir="rtl">

<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>عامل دليفري | تحميل التطبيق</title>

<meta name="description"
content="تحميل تطبيق عامل دليفري - أقرب لك وأسرع في خدمتك.">

<meta name="theme-color" content="#ff7900">

<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
}

html{
    scroll-behavior:smooth;
}

body{
    min-height:100vh;
    font-family:Tahoma,Arial,sans-serif;
    background:
        radial-gradient(
            circle at top right,
            rgba(255,121,0,.12),
            transparent 35%
        ),
        linear-gradient(135deg,#ffffff,#fff7ef);
    color:#07111d;
    display:flex;
    flex-direction:column;
    overflow-x:hidden;
}

a{
    text-decoration:none;
}

/* =========================
   HEADER
========================= */

header{
    width:100%;
    background:rgba(255,255,255,.96);
    border-bottom:1px solid #e9edf1;
    backdrop-filter:blur(12px);
}

.header{
    width:min(92%,1100px);
    min-height:70px;
    margin:auto;
    display:flex;
    align-items:center;
    justify-content:center;
}

.logo{
    display:flex;
    align-items:center;
    gap:10px;
    font-size:21px;
    font-weight:900;
    color:#07111d;
}

.logo img{
    width:48px;
    height:48px;
    object-fit:contain;
}

/* =========================
   MAIN
========================= */

main{
    flex:1;
    display:flex;
    align-items:center;
    justify-content:center;
    padding:45px 15px;
}

.download-box{
    width:min(100%,650px);
    text-align:center;
}

/* =========================
   LOGO
========================= */

.main-logo{
    width:170px;
    height:170px;
    object-fit:contain;
    margin:0 auto 20px;
    filter:drop-shadow(0 15px 25px rgba(0,0,0,.12));
}

/* =========================
   TEXT
========================= */

.badge{
    display:inline-block;
    padding:7px 16px;
    margin-bottom:15px;
    background:#fff0df;
    border:1px solid #ffd6b0;
    border-radius:30px;
    color:#db6500;
    font-size:14px;
    font-weight:900;
}

h1{
    color:#07111d;
    font-size:clamp(36px,7vw,60px);
    line-height:1.15;
    margin-bottom:12px;
}

h1 span{
    color:#ff7900;
}

.description{
    max-width:570px;
    margin:0 auto 25px;
    color:#687586;
    font-size:clamp(15px,2vw,18px);
    line-height:1.8;
}

/* =========================
   DOWNLOAD BUTTON
========================= */

.download-button{
    width:min(100%,360px);
    min-height:58px;
    margin:0 auto;
    display:flex;
    align-items:center;
    justify-content:center;
    gap:10px;
    padding:15px 25px;
    border-radius:16px;
    background:#34a853;
    color:#fff;
    font-size:17px;
    font-weight:900;
    box-shadow:0 12px 30px rgba(52,168,83,.25);
    transition:.2s;
}

.download-button:hover{
    transform:translateY(-3px);
    box-shadow:0 15px 35px rgba(52,168,83,.32);
}

.download-icon{
    font-size:24px;
}

/* =========================
   INFO
========================= */

.info{
    margin:30px auto 0;
    display:flex;
    justify-content:center;
    flex-wrap:wrap;
    gap:10px;
}

.info-item{
    min-width:140px;
    padding:12px 18px;
    background:rgba(255,255,255,.8);
    border:1px solid #e7ebef;
    border-radius:14px;
    color:#526171;
    font-size:13px;
    font-weight:700;
}

/* =========================
   FOOTER
========================= */

footer{
    padding:22px 15px;
    background:#050d15;
    color:#aebbc7;
    text-align:center;
}

footer strong{
    color:#fff;
    font-size:17px;
}

footer p{
    margin-top:4px;
    font-size:12px;
}

/* =========================
   TABLET
========================= */

@media(max-width:700px){

    main{
        padding:40px 15px;
    }

    .main-logo{
        width:140px;
        height:140px;
    }

    .logo{
        font-size:18px;
    }

    .logo img{
        width:42px;
        height:42px;
    }

}

/* =========================
   MOBILE
========================= */

@media(max-width:480px){

    .header{
        min-height:62px;
    }

    main{
        padding:35px 15px;
    }

    .main-logo{
        width:115px;
        height:115px;
        margin-bottom:15px;
    }

    .badge{
        font-size:12px;
        padding:6px 13px;
    }

    h1{
        font-size:36px;
    }

    .description{
        font-size:15px;
    }

    .download-button{
        width:100%;
        min-height:56px;
        font-size:16px;
    }

    .info{
        margin-top:25px;
    }

    .info-item{
        width:100%;
    }

}

/* =========================
   SMALL PHONES
========================= */

@media(max-width:350px){

    h1{
        font-size:31px;
    }

    .main-logo{
        width:100px;
        height:100px;
    }

}

</style>
</head>


<body>

<header>

    <div class="header">

        <div class="logo">

            <img
                src="logo.png"
                alt="شعار عامل دليفري"
            >

            <span>
                عامل دليفري
            </span>

        </div>

    </div>

</header>


<main>

    <section class="download-box">

        <img
            src="logo.png"
            alt="عامل دليفري"
            class="main-logo"
        >

        <div class="badge">
            📱 التطبيق الرسمي
        </div>

        <h1>
            عامل دليفري
            <br>
            <span>أقرب لك وأسرع في خدمتك</span>
        </h1>

        <p class="description">
            حمّل تطبيق عامل دليفري على هاتفك
            واستمتع بالوصول بسهولة إلى خدمات
            وأصحاب المهن في طبرق.
        </p>


        <a
            href="تطبيق عامل دليفري.apk"
            download="تطبيق عامل دليفري.apk"
            class="download-button"
        >

            <span class="download-icon">
                📲
            </span>

            <span>
                تحميل تطبيق Android
            </span>

        </a>


        <div class="info">

            <div class="info-item">
                📱 Android
            </div>

            <div class="info-item">
                📦 تطبيق رسمي
            </div>

            <div class="info-item">
                📍 طبرق
            </div>

        </div>

    </section>

</main>


<footer>

    <strong>
        عامل دليفري
    </strong>

    <p>
        أقرب لك وأسرع في خدمتك
    </p>

    <p>
        © 2026 عامل دليفري — جميع الحقوق محفوظة
    </p>

</footer>

</body>
</html>
